<fieldset class="vn-quest" data-testid="questionario-fieldset">
<style>@media(min-width:768px){html body fieldset.vn-quest .fgv-field{display:flex!important;flex-direction:column!important;justify-content:flex-end!important}}</style>
<label class="description error"></label>
<div class="fgv-field"><label><span class="error">*</span> Qual é seu estado civil legal?</label>
<select class="select" name="ESTADO_CIVIL" required="" data-testid="select-estado-civil">
<option selected="" value="">Selecione</option>
<option value="Solteiro">Solteiro</option>
<option value="Casado">Casado</option>
<option value="Separado ou divorciado">Separado ou divorciado</option>
<option value="Viúvo">Viúvo</option>
</select></div>
<label class="description error"></label>
<div class="fgv-field"><label><span class="error">*</span> Que tipo de curso de ensino médio você concluiu ou concluirá?</label>
<select class="select" name="TIPO_ENSINO_MEDIO" required="" data-testid="select-tipo-ensino-medio">
<option selected="" value="">Selecione</option>
<option value="Ensino médio comum">Ensino médio comum</option>
<option value="Ensino profissionalizante">Ensino profissionalizante</option>
<option value="Magistério">Magistério</option>
<option value="Educação de jovens e adultos (EJA)">Educação de jovens e adultos (EJA)</option>
<option value="Outro">Outro</option>
</select></div>
<label class="description error"></label>
<div class="fgv-field"><label><span class="error">*</span> Em que estado você concluiu ou concluirá o ensino médio?</label>
<select class="select" name="UF_ENSINO_MEDIO" required="" data-testid="select-uf-ensino-medio">
<option selected="" value="">Selecione</option>
<option value="São Paulo">São Paulo</option>
<option value="Minas Gerais">Minas Gerais</option>
<option value="Paraná">Paraná</option>
<option value="Rio de Janeiro">Rio de Janeiro</option>
<option value="Mato Grosso do Sul, Mato Grosso, Goiás, Distrito Federal">Mato Grosso do Sul, Mato Grosso, Goiás, Distrito Federal</option>
<option value="Demais estados ou outros países">Demais estados ou outros países</option>
</select></div>
<label class="description error"></label>
<div class="fgv-field"><label><span class="error">*</span> Em que ano você concluiu ou concluirá o ensino médio?</label>
<select class="select" name="ANO_ENSINO_MEDIO" required="" data-testid="select-ano-ensino-medio">
<option selected="" value="">Selecione</option>
<option value="2022 ou antes">2022 ou antes</option>
<option value="2023">2023</option>
<option value="2024">2024</option>
<option value="2025">2025</option>
<option value="2026">2026</option>
<option value="2027 ou após">2027 ou após</option>
</select></div>
</fieldset>
